<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root{
            --bg:#08090d;
            --border:rgba(255,255,255,.09);
            --text:#f4f5f7;
            --muted:#9ea1ad;
            --accent:#a78bfa;
            --accent-soft:rgba(167,139,250,.16);
        }

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            min-height:100vh;
            padding:24px 16px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
            color:var(--text);
            background:
                radial-gradient(circle at 12% 8%, rgba(124,58,237,.22), transparent 42%),
                radial-gradient(circle at 88% 18%, rgba(56,189,248,.14), transparent 40%),
                radial-gradient(circle at 50% 100%, rgba(236,72,153,.12), transparent 45%),
                var(--bg);
        }

        .google-page{
            width:100%;
            max-width:560px;
        }

        .google-card{
            padding:36px 26px;
            border:1px solid var(--border);
            border-radius:28px;
            background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.035));
            box-shadow:0 24px 70px rgba(0,0,0,.42);
            backdrop-filter:blur(22px) saturate(140%);
            -webkit-backdrop-filter:blur(22px) saturate(140%);
            text-align:center;
        }

        .google-logo{
            display:block;
            width:170px;
            margin:0 auto 26px;
        }

        .search-form{
            width:100%;
        }

        .search-box{
            display:flex;
            align-items:center;
            gap:12px;
            padding:14px 18px;
            border:1px solid var(--border);
            border-radius:18px;
            background:rgba(255,255,255,.04);
            transition:border-color .2s ease, background .2s ease;
        }

        .search-box:focus-within{
            border-color:rgba(167,139,250,.55);
            background:rgba(167,139,250,.08);
        }

        .search-icon{
            flex:0 0 auto;
            width:18px;
            height:18px;
            color:var(--muted);
        }

        .search-input{
            flex:1;
            min-width:0;
            color:var(--text);
            font:inherit;
            font-size:15px;
            border:0;
            background:transparent;
            outline:none;
        }

        .search-input::placeholder{
            color:#6d707b;
        }

        .search-buttons{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:12px;
            margin-top:20px;
        }

        .search-button{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            padding:13px 22px;
            color:#151029;
            font:inherit;
            font-size:14px;
            font-weight:600;
            text-decoration:none;
            cursor:pointer;
            border:0;
            border-radius:16px;
            background:linear-gradient(135deg,#a78bfa,#7dd3fc);
            box-shadow:0 12px 28px rgba(167,139,250,.22);
            transition:transform .16s ease, filter .2s ease;
        }

        .search-button:hover{
            transform:translateY(-1px);
            filter:brightness(1.05);
        }

        .search-button:active{
            transform:scale(.98);
        }

        .quick-links{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:10px;
            margin-top:26px;
        }

        .quick-link{
            display:inline-flex;
            align-items:center;
            padding:10px 15px;
            color:var(--muted);
            font-size:13px;
            font-weight:500;
            text-decoration:none;
            border:1px solid var(--border);
            border-radius:14px;
            background:rgba(255,255,255,.035);
            transition:color .2s ease, border-color .2s ease, background .2s ease;
        }

        .quick-link:hover{
            color:var(--text);
            border-color:rgba(167,139,250,.45);
            background:var(--accent-soft);
        }

        .footer-note{
            margin-top:22px;
            color:#6d707b;
            font-size:11px;
            line-height:1.6;
        }

        @media (max-width:420px){
            body{
                padding:16px 12px;
            }

            .google-card{
                padding:26px 18px;
            }

            .google-logo{
                width:140px;
            }

            .search-button{
                width:100%;
            }
        }
    </style>
</head>
<body>
    <main class="google-page">
        <section class="google-card">
            <img class="google-logo" src="Google.png" alt="Google">

            <form class="search-form" action="https://www.google.com/search" method="get">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                    </svg>

                    <input
                        class="search-input"
                        type="text"
                        name="q"
                        placeholder="Zoeken op Google"
                        autocomplete="off"
                        autofocus
                    />
                </div>

                <div class="search-buttons">
                    <button class="search-button" type="submit">Google zoeken</button>
                    <a class="search-button" href="https://www.google.com/search?igu=1&amp;q=Ik+heb+het+geluk">Ik doe een gok</a>
                </div>
            </form>

            <nav class="quick-links">
                <a class="quick-link" href="https://news.google.coms">Nieuws</a>
                <a class="quick-link" href="https://www.google.com/search?igu=1&amp;q=Weer">Weer</a>
                <a class="quick-link" href="https://translate.google.com">Vertalen</a>
                <a class="quick-link" href="https://youtube.com">YouTube</a>
                <a class="quick-link" href="https://google.com/maps">Maps</a>
            </nav>

            <p class="footer-note">
                Google Quinten
            </p>
        </section>
    </main>
</body>
</html>
